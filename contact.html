<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Contact | Coastal Haven Hotel</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">

</head>


<body>


<header>

    <nav class="navbar navbar-expand-lg navbar-dark">

        <div class="container">

            <a class="navbar-brand"
               href="index.html">
                Coastal Haven Hotel
            </a>

            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#mainNav">

                <span class="navbar-toggler-icon"></span>

            </button>

            <div
                class="collapse navbar-collapse"
                id="mainNav">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link"
                           href="index.html">
                            Home
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link"
                           href="rooms.html">
                            Rooms
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link"
                           href="facilities.html">
                            Facilities
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link"
                           href="about.html">
                            About
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active"
                           href="contact.html">
                            Contact
                        </a>
                    </li>

                </ul>

            </div>

        </div>

    </nav>

</header>


<main class="container my-5 form-section">

    <h1>
        Contact Coastal Haven Hotel
    </h1>

    <p>
        Please complete the form below to send us
        an enquiry.
    </p>


    <form id="enquiryForm"
          novalidate>


        <!-- Name -->

        <div class="mb-3">

            <label
                for="name"
                class="form-label">

                Name *

            </label>

            <input
                type="text"
                id="name"
                class="form-control">

            <div
                id="nameError"
                class="error-message">
            </div>

        </div>


        <!-- Email -->

        <div class="mb-3">

            <label
                for="email"
                class="form-label">

                Email *

            </label>

            <input
                type="text"
                id="email"
                class="form-control">

            <div
                id="emailError"
                class="error-message">
            </div>

        </div>


        <!-- Phone -->

        <div class="mb-3">

            <label
                for="phone"
                class="form-label">

                Phone Number *

            </label>

            <input
                type="text"
                id="phone"
                class="form-control">

            <div
                id="phoneError"
                class="error-message">
            </div>

        </div>


        <!-- Subject -->

        <div class="mb-3">

            <label
                for="subject"
                class="form-label">

                Subject *

            </label>

            <input
                type="text"
                id="subject"
                class="form-control">

            <div
                id="subjectError"
                class="error-message">
            </div>

        </div>


        <!-- Query -->

        <div class="mb-3">

            <label
                for="query"
                class="form-label">

                Your Enquiry *

            </label>

            <textarea
                id="query"
                class="form-control"
                rows="5">
            </textarea>

            <div
                id="queryError"
                class="error-message">
            </div>

        </div>


        <button
            type="submit"
            class="btn btn-primary">

            Send Enquiry

        </button>


        <div
            id="formMessage"
            class="mt-3 fw-bold">
        </div>


    </form>

</main>


<footer class="text-center py-4 mt-5">

    <p class="mb-1">
        &copy; 2026 Coastal Haven Hotel
    </p>

    <p class="mb-1">
        Last updated: August 2026
    </p>

    <p class="mb-0">
        Email:
        <a href="mailto:info@coastalhavenhotel.com">
            info@coastalhavenhotel.com
        </a>
    </p>

</footer>


<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

<script src="js/script.js"></script>


</body>

</html>
